<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Absensi Scan Wajah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- face-api.js untuk deteksi & ekstraksi descriptor wajah di browser -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <div class="max-w-5xl mx-auto p-4 md:p-8">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-emerald-400">Absensi Face Recognition</h1>
      <p class="text-slate-400 text-sm mt-1">Berbasis Node.js, Vercel & Firebase Firestore</p>
      <div id="modelStatus" class="mt-3 inline-block px-3 py-1 rounded-full text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30">
        Memuat model AI pengenalan wajah...
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Kolom Kiri: Kamera & Kontrol -->
      <div class="lg:col-span-7 bg-slate-800/80 border border-slate-700 rounded-2xl p-5 shadow-xl">
        <div class="relative rounded-xl overflow-hidden bg-black aspect-video flex items-center justify-center border border-slate-700">
          <video id="video" autoplay muted playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
          <canvas id="overlay" class="absolute inset-0 w-full h-full pointer-events-none transform -scale-x-100"></canvas>
        </div>

        <!-- Tabs Mode -->
        <div class="flex gap-2 mt-5 border-b border-slate-700 pb-3">
          <button id="tabAbsen" onclick="switchMode('absen')" class="px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-600 text-white">
            Mode Absensi
          </button>
          <button id="tabDaftar" onclick="switchMode('daftar')" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600">
            Daftarkan Wajah Baru
          </button>
        </div>

        <!-- Panel Absensi -->
        <div id="panelAbsen" class="mt-4 space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <button onclick="prosesAbsen('Masuk')" id="btnMasuk" disabled
              class="py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 font-semibold transition flex items-center justify-center gap-2">
              Scan Absen Masuk
            </button>
            <button onclick="prosesAbsen('Pulang')" id="btnPulang" disabled
              class="py-3 px-4 rounded-xl bg-sky-600 hover:bg-sky-500 disabled:opacity-40 font-semibold transition flex items-center justify-center gap-2">
              Scan Absen Pulang
            </button>
          </div>
        </div>

        <!-- Panel Registrasi -->
        <div id="panelDaftar" class="mt-4 space-y-3 hidden">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Nama Lengkap</label>
            <input type="text" id="inputNama" placeholder="Contoh: Budi Santoso"
              class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:border-emerald-500 focus:outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Jabatan / Divisi</label>
            <input type="text" id="inputJabatan" placeholder="Contoh: Staff IT"
              class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:border-emerald-500 focus:outline-none text-sm" />
          </div>
          <button onclick="prosesDaftar()" id="btnDaftar" disabled
            class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 font-semibold transition">
            Simpan Data Wajah
          </button>
        </div>

        <!-- Notifikasi Hasil -->
        <div id="alertBox" class="mt-4 hidden p-3 rounded-xl text-sm border"></div>
      </div>

      <!-- Kolom Kanan: Riwayat Absensi -->
      <div class="lg:col-span-5 bg-slate-800/80 border border-slate-700 rounded-2xl p-5 shadow-xl flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-semibold text-lg text-slate-200">Riwayat Absensi Terbaru</h2>
          <button onclick="loadLogs()" class="text-xs text-emerald-400 hover:underline">Refresh</button>
        </div>

        <div id="logsContainer" class="space-y-2.5 overflow-y-auto max-h-[460px] pr-1">
          <p class="text-slate-500 text-sm text-center py-8">Memuat data...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const modelStatus = document.getElementById('modelStatus');
    const alertBox = document.getElementById('alertBox');
    let modelsLoaded = false;

    // URL Model publik face-api.js
    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

    window.addEventListener('DOMContentLoaded', async () => {
      await startCamera();
      await loadModels();
      loadLogs();
    });

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
      } catch (err) {
        showAlert('error', 'Izin kamera ditolak atau kamera tidak ditemukan: ' + err.message);
      }
    }

    async function loadModels() {
      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        modelsLoaded = true;
        modelStatus.textContent = 'Model AI Siap • Arahkan wajah ke kamera';
        modelStatus.className = 'mt-3 inline-block px-3 py-1 rounded-full text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';

        document.getElementById('btnMasuk').disabled = false;
        document.getElementById('btnPulang').disabled = false;
        document.getElementById('btnDaftar').disabled = false;
      } catch (err) {
        modelStatus.textContent = 'Gagal memuat model AI';
        showAlert('error', 'Gagal mengunduh model AI: ' + err.message);
      }
    }

    function switchMode(mode) {
      const isAbsen = mode === 'absen';
      document.getElementById('panelAbsen').classList.toggle('hidden', !isAbsen);
      document.getElementById('panelDaftar').classList.toggle('hidden', isAbsen);

      document.getElementById('tabAbsen').className = isAbsen
        ? 'px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-600 text-white'
        : 'px-4 py-2 rounded-lg text-sm font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600';

      document.getElementById('tabDaftar').className = !isAbsen
        ? 'px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-600 text-white'
        : 'px-4 py-2 rounded-lg text-sm font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600';

      alertBox.classList.add('hidden');
    }

    async function getFaceDescriptor() {
      if (!modelsLoaded) return null;
      const detection = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (!detection) return null;
      return Array.from(detection.descriptor);
    }

    async function prosesDaftar() {
      const nama = document.getElementById('inputNama').value.trim();
      const jabatan = document.getElementById('inputJabatan').value.trim();

      if (!nama) return showAlert('error', 'Nama lengkap wajib diisi.');

      setLoading(true, 'Memindai wajah...');
      const descriptor = await getFaceDescriptor();

      if (!descriptor) {
        setLoading(false);
        return showAlert('error', 'Wajah tidak terdeteksi! Posisikan wajah tepat di depan kamera.');
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, jabatan, descriptor })
        });
        const data = await res.json();

        if (data.success) {
          showAlert('success', data.message);
          document.getElementById('inputNama').value = '';
          document.getElementById('inputJabatan').value = '';
        } else {
          showAlert('error', data.message);
        }
      } catch (err) {
        showAlert('error', 'Terjadi kesalahan jaringan.');
      }
      setLoading(false);
    }

    async function prosesAbsen(tipe) {
      setLoading(true, `Memverifikasi wajah untuk Absen ${tipe}...`);
      const descriptor = await getFaceDescriptor();

      if (!descriptor) {
        setLoading(false);
        return showAlert('error', 'Wajah tidak terdeteksi di kamera.');
      }

      try {
        const res = await fetch('/api/absen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ descriptor, tipe })
        });
        const result = await res.json();

        if (result.success) {
          showAlert('success', `${result.message} (${result.data.nama} - Kemiripan ${result.data.akurasi})`);
          loadLogs();
        } else {
          showAlert('error', result.message);
        }
      } catch (err) {
        showAlert('error', 'Gagal terhubung ke server.');
      }
      setLoading(false);
    }

    async function loadLogs() {
      const container = document.getElementById('logsContainer');
      try {
        const res = await fetch('/api/logs');
        const result = await res.json();

        if (!result.success || result.data.length === 0) {
          container.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">Belum ada riwayat absensi.</p>';
          return;
        }

        container.innerHTML = result.data.map(item => {
          const badgeColor = item.tipe === 'Masuk'
            ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'
            : 'bg-sky-500/20 text-sky-300 border-sky-500/30';

          return `
            <div class="p-3 rounded-xl bg-slate-900/70 border border-slate-700/80 flex items-center justify-between">
              <div>
                <p class="font-semibold text-sm text-slate-100">${item.nama}</p>
                <p class="text-xs text-slate-400">${item.jabatan} • ${item.waktuString || ''}</p>
              </div>
              <div class="text-right">
                <span class="px-2.5 py-0.5 rounded-md text-xs font-medium border ${badgeColor}">${item.tipe}</span>
                <p class="text-[11px] text-slate-500 mt-1">Match: ${item.akurasi || '-'}</p>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<p class="text-rose-400 text-sm text-center py-4">Gagal memuat riwayat.</p>';
      }
    }

    function showAlert(type, message) {
      alertBox.classList.remove('hidden');
      if (type === 'success') {
        alertBox.className = 'mt-4 p-3 rounded-xl text-sm border bg-emerald-500/15 border-emerald-500/40 text-emerald-300';
      } else {
        alertBox.className = 'mt-4 p-3 rounded-xl text-sm border bg-rose-500/15 border-rose-500/40 text-rose-300';
      }
      alertBox.textContent = message;
    }

    function setLoading(isLoading, text = '') {
      document.getElementById('btnMasuk').disabled = isLoading;
      document.getElementById('btnPulang').disabled = isLoading;
      document.getElementById('btnDaftar').disabled = isLoading;
      if (isLoading) {
        alertBox.className = 'mt-4 p-3 rounded-xl text-sm border bg-slate-700/50 border-slate-600 text-slate-300';
        alertBox.textContent = text;
        alertBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
